spring.application.name=question-find-server
server.port=8080

# DeepSeek 模型配置（API Key 通过环境变量 DEEPSEEK_API_KEY 注入，不要写死在代码里）
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.api-url=https://api.deepseek.com/chat/completions
deepseek.model=deepseek-v4-pro

# 任务队列配置：最大并发模型调用数 + 最大等待队列长度
task.max-concurrent=3
task.max-queue-size=100
